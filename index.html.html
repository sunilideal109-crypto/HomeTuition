<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Receipt – Home Tuition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f0f4f0;padding:1rem;min-height:100vh}
  h1.page-title{text-align:center;font-size:18px;font-weight:700;color:#085041;margin-bottom:1.25rem}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:960px;margin:0 auto}
  @media(max-width:680px){.wrap{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid #d0e8df;border-radius:12px;padding:1.25rem}
  .panel h2{font-size:14px;font-weight:700;color:#0F6E56;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #e0f0ea;padding-bottom:8px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:#555;margin-bottom:4px;font-weight:600}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid #c8ddd8;border-radius:7px;font-size:14px;background:#fff;color:#222}
  .field input:focus,.field select:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 2px #d0f0e6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}
  .btn{flex:1;min-width:80px;padding:9px 6px;border:1px solid #c8ddd8;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#333;transition:background 0.15s;text-align:center}
  .btn:hover{background:#eaf5f0}
  .btn.primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
  .btn.primary:hover{background:#0F6E56}
  .btn.whatsapp{background:#25D366;color:#fff;border-color:#25D366}
  .btn.whatsapp:hover{background:#1ebe5d}
  .btn.imgbtn{background:#6c63ff;color:#fff;border-color:#6c63ff}
  .btn.imgbtn:hover{background:#5a52d5}
  /* Receipt */
  .receipt{font-family:'Courier New',monospace;font-size:13px;color:#222;line-height:1.6}
  .receipt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;border-bottom:2px solid #222;padding-bottom:8px}
  .receipt-header-left{display:flex;align-items:center;gap:10px}
  .receipt-logo{width:70px;height:auto}
  .receipt-title{font-size:14px;font-weight:700;letter-spacing:0.5px}
  .receipt-sub{font-size:11px;color:#666;margin-top:2px}
  .receipt-qr{width:60px;height:60px;flex-shrink:0}
  .receipt-no{font-size:11px;color:#888;text-align:right;margin-bottom:4px}
  .divider{border:none;border-top:1.5px dashed #bbb;margin:9px 0}
  .receipt-row{display:flex;justify-content:space-between;padding:2px 0;font-size:13px}
  .receipt-row .lbl{color:#666;font-size:12px}
  .receipt-row .val{font-weight:600;text-align:right;max-width:60%}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .upi{background:#d6f5ea;color:#085041}
  .cash{background:#faeeda;color:#633806}
  .bank{background:#ddeeff;color:#0a3a6b}
  .cheque{background:#f5e6ff;color:#4a0080}
  .amount-box{background:#eaf8f2;border:1px solid #a8e0cc;border-radius:8px;padding:10px 12px;margin:10px 0;text-align:center}
  .amount-box .amt{font-size:24px;font-weight:700;color:#1D9E75}
  .amount-box .lbl{font-size:11px;color:#555}
  .stamp{border:2.5px solid #1D9E75;border-radius:6px;display:inline-block;padding:4px 16px;color:#1D9E75;font-size:13px;font-weight:700;letter-spacing:3px;margin-top:8px;transform:rotate(-3deg)}
  .receipt-footer{text-align:center;font-size:11px;color:#888;margin-top:10px;border-top:1px solid #ddd;padding-top:8px;line-height:1.6}
  .empty{text-align:center;color:#aaa;padding:3rem 0;font-size:14px}
  .empty-icon{font-size:40px;display:block;margin-bottom:10px;opacity:0.3}
  .hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #e0eee8;border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;transition:background 0.12s}
  .hist-row:hover{background:#eaf5f0}
  .hist-name{font-weight:600}
  .hist-meta{font-size:11px;color:#777}
  .hist-amt{font-weight:700;color:#1D9E75}
  /* Capture area used by html2canvas */
  #captureArea{background:#fff;padding:16px;border-radius:8px}
  @media print{
    body{background:#fff;padding:0}
    .wrap{display:block}
    .panel:first-child,.btns,.page-title{display:none!important}
    .panel:last-child{border:none;padding:0}
    #histPanel{display:none!important}
  }
</style>
</head>
<body>
<h1 class="page-title">📋 Home Tuition — Fee Receipt Generator</h1>
<div class="wrap">
  <div>
    <div class="panel">
      <h2>📝 Receipt Details</h2>
      <div class="field"><label>Student Name *</label><input id="sname" type="text" placeholder="Enter student full name"></div>
      <div class="row2">
        <div class="field"><label>Class *</label>
          <select id="class">
            <option value="">— Select Class —</option>
            <option>Nursery</option><option>Jr. Kg</option><option>Sr. Kg</option>
            <option>1st</option><option>2nd</option><option>3rd</option>
            <option>4th</option><option>5th</option><option>6th</option>
          </select>
        </div>
        <div class="field"><label>Batch Time *</label>
          <select id="batch">
            <option value="">— Select Batch —</option>
            <option>9:00 AM – 11:00 AM</option>
            <option>4:30 PM – 6:30 PM</option>
            <option>6:30 PM – 8:30 PM</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Month *</label>
          <select id="month">
            <option value="">— Select Month —</option>
            <option>June 2026</option><option>July 2026</option><option>August 2026</option>
            <option>September 2026</option><option>October 2026</option><option>November 2026</option>
            <option>December 2026</option><option>January 2027</option><option>February 2027</option>
            <option>March 2027</option><option>April 2027</option><option>May 2027</option>
          </select>
        </div>
        <div class="field"><label>Fee Amount (₹) *</label><input id="fee" type="number" placeholder="e.g. 1500" min="0"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Payment Mode *</label>
          <select id="mode">
            <option value="">— Select Mode —</option>
            <option value="UPI">UPI</option><option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option><option value="Cheque">Cheque</option>
          </select>
        </div>
        <div class="field"><label>UPI / Txn ID (optional)</label><input id="txn" type="text" placeholder="For UPI payments"></div>
      </div>
      <div class="btns">
        <button class="btn" onclick="clearForm()">🔄 Clear</button>
        <button class="btn primary" onclick="generateReceipt()">🧾 Generate</button>
      </div>
    </div>
    <div class="panel" id="histPanel" style="margin-top:1rem;display:none">
      <h2>🕘 Recent Receipts</h2>
      <div id="histList"></div>
    </div>
  </div>

  <!-- RECEIPT PANEL -->
  <div class="panel" style="min-height:360px">
    <div class="empty" id="emptyState">
      <span class="empty-icon">🧾</span>
      Fill in the details and click<br><strong>Generate Receipt</strong>
    </div>
    <div id="receiptOut" style="display:none">
      <div id="captureArea">
        <div class="receipt" id="receiptContent"></div>
      </div>
      <!-- ACTION BUTTONS -->
      <div class="btns" style="margin-top:1rem">
        <button class="btn" onclick="printReceipt()" title="Print receipt">🖨️ Print</button>
        <button class="btn primary" onclick="saveAsPDF()" title="Save as PDF">📄 PDF</button>
        <button class="btn imgbtn" onclick="saveAsImage()" title="Download as image">🖼️ Image</button>
        <button class="btn whatsapp" onclick="shareWhatsApp()" title="Share on WhatsApp">💬 WhatsApp</button>
      </div>
      <div class="btns">
        <button class="btn primary" onclick="saveReceipt()" style="background:#0F6E56">💾 Save Record</button>
      </div>
    </div>
  </div>
</div>

const MONTH_CODE = {
  'January':'01','February':'02','March':'03','April':'04',
  'May':'05','June':'06','July':'07','August':'08',
  'September':'09','October':'10','November':'11','December':'12'
};

let receipts = JSON.parse(localStorage.getItem('ht_receipts') || '[]');
let currentReceipt = null;

function pad(n){ return String(n).padStart(4,'0'); }

function makeReceiptNo(month){
  const parts = month.split(' ');
  const mcode = MONTH_CODE[parts[0]] || '00';
  return 'HT-' + mcode + '-' + pad(receipts.length + 1);
}

function generateReceipt(){
  const name  = document.getElementById('sname').value.trim();
  const cls   = document.getElementById('class').value;
  const batch = document.getElementById('batch').value;
  const month = document.getElementById('month').value;
  const fee   = document.getElementById('fee').value;
  const mode  = document.getElementById('mode').value;
  const txn   = document.getElementById('txn').value.trim();

  if(!name||!cls||!batch||!month||!fee||!mode){
    alert('Please fill in all required (*) fields.');
    return;
  }

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const timeStr = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const rno = makeReceiptNo(month);

  currentReceipt = {rno,name,cls,batch,month,fee,mode,txn,dateStr,timeStr};

  const modeClass = {UPI:'upi',Cash:'cash','Bank Transfer':'bank',Cheque:'cheque'}[mode]||'cash';
  const amtFormatted = parseInt(fee).toLocaleString('en-IN');

  document.getElementById('receiptContent').innerHTML = `
    <div class="receipt-no">Receipt No: ${rno}</div>
    <div class="receipt-header">
      <div class="receipt-header-left">
        <img class="receipt-logo" src="${LOGO_SRC}" alt="Logo">
        <div>
          <div class="receipt-title">Home Tuition</div>
          <div class="receipt-sub">Fee Payment Receipt</div>
        </div>
      </div>
      <img class="receipt-qr" src="${QR_SRC}" alt="QR">
    </div>
    <hr class="divider">
    <div class="receipt-row"><span class="lbl">Date &amp; Time</span><span class="val">${dateStr}, ${timeStr}</span></div>
    <hr class="divider">
    <div class="receipt-row"><span class="lbl">Student Name</span><span class="val">${name}</span></div>
    <div class="receipt-row"><span class="lbl">Class</span><span class="val">${cls}</span></div>
    <div class="receipt-row"><span class="lbl">Batch</span><span class="val">${batch}</span></div>
    <hr class="divider">
    <div class="receipt-row"><span class="lbl">Month</span><span class="val">${month}</span></div>
    <div class="receipt-row"><span class="lbl">Payment Mode</span><span class="val"><span class="badge ${modeClass}">${mode}</span></span></div>
    ${txn ? `<div class="receipt-row"><span class="lbl">Txn / UPI ID</span><span class="val">${txn}</span></div>` : ''}
    <hr class="divider">
    <div class="amount-box">
      <div class="lbl">Fee Paid</div>
      <div class="amt">₹${amtFormatted}</div>
    </div>
    <div style="text-align:center"><span class="stamp">PAID</span></div>
    <div class="receipt-footer">
      Thank You for Your Payment!<br>
      <span style="font-size:10px">This is a system-generated fee receipt and does not require a signature.</span>
    </div>
  `;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('receiptOut').style.display = 'block';
}

/* ── PRINT ── */
function printReceipt(){
  const content = document.getElementById('receiptContent').innerHTML;
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fee Receipt</title>
  <style>
    @page{size:A5 portrait;margin:12mm 14mm}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    body{font-family:'Courier New',monospace;font-size:11pt;color:#000;background:#fff}
    .receipt-wrapper{max-width:148mm;margin:0 auto;border:1.5px solid #333;border-radius:8px;padding:10mm}
    .receipt-no{font-size:8pt;color:#555;text-align:right;margin-bottom:5px}
    .receipt-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
    .receipt-header-left{display:flex;align-items:center;gap:8px}
    .receipt-logo{width:70px;height:auto}
    .receipt-title{font-size:13pt;font-weight:700}
    .receipt-sub{font-size:9pt;color:#444;margin-top:2px}
    .receipt-qr{width:64px;height:64px}
    .divider{border:none;border-top:1px dashed #888;margin:6px 0}
    .receipt-row{display:flex;justify-content:space-between;padding:3px 0;font-size:10pt}
    .lbl{color:#555;font-size:9pt;flex:0 0 42%}
    .val{font-weight:700;text-align:right;flex:0 0 56%}
    .badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:9pt;font-weight:700;border:1.5px solid #000}
    .amount-box{text-align:center;border:2px solid #000;border-radius:6px;padding:8px;margin:8px 0}
    .amount-box .lbl{display:block;font-size:8pt;color:#555;flex:none;text-align:center}
    .amt{font-size:20pt;font-weight:700;display:block}
    .stamp{display:inline-block;border:2.5px solid #1a7a56;border-radius:5px;padding:3px 16px;color:#1a7a56;font-size:12pt;font-weight:700;letter-spacing:4px;transform:rotate(-3deg)}
    .receipt-footer{text-align:center;font-size:8.5pt;color:#444;margin-top:10px;border-top:1px solid #ccc;padding-top:7px;line-height:1.7;font-weight:600}
    .receipt-footer span{font-weight:400;font-size:7.5pt;color:#666}
  </style></head><body>
  <div class="receipt-wrapper">${content}</div>
  <script>window.onload=function(){window.print();}<\/script>
  </body></html>`);
  w.document.close();
}

/* ── SAVE AS PDF ── */
function saveAsPDF(){
  printReceipt(); // browser "Save as PDF" via print dialog
}

/* ── SAVE AS IMAGE ── */
function saveAsImage(){
  const area = document.getElementById('captureArea');
  html2canvas(area, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff',
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    const rno = currentReceipt ? currentReceipt.rno : 'receipt';
    link.download = rno + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

/* ── SHARE ON WHATSAPP ── */
function shareWhatsApp(){
  if(!currentReceipt){ alert('Generate a receipt first.'); return; }
  const r = currentReceipt;
  const amt = parseInt(r.fee).toLocaleString('en-IN');
  const msg =
    `🧾 *Fee Receipt – Home Tuition*
` +
    `━━━━━━━━━━━━━━━━━━
` +
    `📋 Receipt No : ${r.rno}
` +
    `📅 Date       : ${r.dateStr}
` +
    `━━━━━━━━━━━━━━━━━━
` +
    `👤 Student    : ${r.name}
` +
    `📚 Class      : ${r.cls}
` +
    `⏰ Batch      : ${r.batch}
` +
    `📆 Month      : ${r.month}
` +
    `━━━━━━━━━━━━━━━━━━
` +
    `💳 Mode       : ${r.mode}
` +
    (r.txn ? `🔖 Txn ID     : ${r.txn}
` : '') +
    `💰 Fee Paid   : ₹${amt}
` +
    `━━━━━━━━━━━━━━━━━━
` +
    `✅ *PAID*
` +
    `Thank You for Your Payment!`;

  const url = 'https://wa.me/?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}

/* ── SAVE RECORD ── */
function saveReceipt(){
  if(!currentReceipt){ alert('Generate a receipt first.'); return; }
  receipts.unshift(currentReceipt);
  if(receipts.length > 100) receipts = receipts.slice(0,100);
  localStorage.setItem('ht_receipts', JSON.stringify(receipts));
  renderHistory();
  alert('Receipt saved! ✅');
}

function renderHistory(){
  if(!receipts.length){ document.getElementById('histPanel').style.display='none'; return; }
  document.getElementById('histPanel').style.display='block';
  document.getElementById('histList').innerHTML = receipts.slice(0,8).map(r=>`
    <div class="hist-row" onclick="loadReceipt('${r.rno}')">
      <div>
        <div class="hist-name">${r.name}</div>
        <div class="hist-meta">${r.cls} · ${r.month} · ${r.rno}</div>
      </div>
      <div class="hist-amt">₹${parseInt(r.fee).toLocaleString('en-IN')}</div>
    </div>`).join('');
}

function loadReceipt(rno){
  const r = receipts.find(x=>x.rno===rno);
  if(!r) return;
  document.getElementById('sname').value = r.name;
  document.getElementById('class').value = r.cls;
  document.getElementById('batch').value = r.batch;
  document.getElementById('month').value = r.month;
  document.getElementById('fee').value   = r.fee;
  document.getElementById('mode').value  = r.mode;
  document.getElementById('txn').value   = r.txn||'';
  currentReceipt = r;
  generateReceipt();
}

function clearForm(){
  ['sname','fee','txn'].forEach(id=>document.getElementById(id).value='');
  ['class','batch','month','mode'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('emptyState').style.display='block';
  document.getElementById('receiptOut').style.display='none';
  currentReceipt=null;
}

renderHistory();
</script>
</body>
